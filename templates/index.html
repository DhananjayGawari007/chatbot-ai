<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareNest AI Assistant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* CSS goes here - see below */
  </style>
</head>
<body>

<div class="chat">
  <!-- Header with Health Icon -->
  <div class="chat-header">
    <div class="header-info">
      <div class="bot-icon">
        <i class="fa-solid fa-user-nurse"></i>
        <span class="online-indicator"></span>
      </div>
      <div>
        <h3>CareNest AI</h3>
        <p>Health & Wellness Assistant</p>
      </div>
    </div>
  </div>

  <!-- Messages Area -->
  <div id="messages">
    <!-- Initial Greeting -->
    <div class="message bot">Hello! I'm your CareNest assistant. How can I help with your wellness journey today?</div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <input id="input" autocomplete="off" placeholder="Ask about symptoms, wellness, or products..." />
    <button onclick="send()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>

<script>
// YOUR LOGIC UNCHANGED
async function send() {
  const input = document.getElementById("input");
  const msg = input.value;
  if (!msg) return;

  add("You", msg);
  input.value = "";

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg })
  });

  const data = await res.json();
  add("Bot", data.reply);
}

function add(sender, text) {
  const messages = document.getElementById("messages");
  const div = document.createElement("div");

  div.classList.add("message");
  div.classList.add(sender === "You" ? "user" : "bot");
  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;

  if (sender === "Bot") {
    let i = 0;
    const interval = setInterval(() => {
      div.textContent += text.charAt(i);
      i++;
      messages.scrollTop = messages.scrollHeight;
      if (i >= text.length) clearInterval(interval);
    }, 15);
  } else {
    div.textContent = text;
  }
}

document.getElementById("input").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
